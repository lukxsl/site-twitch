<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>asemtet0 | Streamer & Comunidade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- NAV -->
    <nav class="nav-glass">
        <div class="nav-container">
            <div class="logo" onclick="mudarAba('inicio')">
                <span class="logo-icon">💜</span>
                <span class="logo-text">asemtet0</span>
            </div>
            <ul class="nav-links" id="navLinks">
                <li><button class="nav-btn on" data-aba="inicio" onclick="mudarAba('inicio')">Início</button></li>
                <li><button class="nav-btn" data-aba="tierlist" onclick="mudarAba('tierlist')">Tier List</button></li>
                <li><button class="nav-btn" data-aba="comunidade" onclick="mudarAba('comunidade')">Comunidade</button></li>
                <li><button class="nav-btn" data-aba="setup" onclick="mudarAba('setup')">Setup</button></li>
                <li class="nav-admin-link" style="display:none;"><button class="nav-btn admin" data-aba="admin" onclick="mudarAba('admin')">⚙️ Admin</button></li>
            </ul>
            <div class="nav-auth" id="navAuth"></div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="main-container">
        <!-- As sections serão renderizadas/populadas pelo JS -->
        <section id="sec-inicio" class="page-section ativo"></section>
        <section id="sec-tierlist" class="page-section"></section>
        <section id="sec-comunidade" class="page-section"></section>
        <section id="sec-setup" class="page-section"></section>
        <section id="sec-admin" class="page-section"></section>
    </main>

    <!-- MODALS -->
    <dialog id="dlg" class="modal-glass"></dialog>
    <dialog id="confirmDlg" class="modal-glass confirm-modal"></dialog>

    <script src="app.js"></script>
    <script src="admin-ui.js"></script>
</body>
</html>
